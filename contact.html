  <header class="site-header">

      <a class="active" href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page narrow">
    <h1>Contact</h1>
    <p class="intro">For performances, private lessons, or other inquiries, send me a message.</p>
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required>
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="message">Message</label><textarea id="message" name="message" rows="7" required></textarea>
      <button class="button" type="submit">Send message</button>
    </form>
  </main>

  <footer>© 2026 Max Robertson</footer>
</body>
